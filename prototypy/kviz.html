<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kdo je čistší? Denní energetický kvíz</title>
<style>
:root{--bg:#eef6f0;--card:#fff;--fg:#1c2b22;--mut:#66756c;--line:#d8e6dc;--ok:#2f9e5a;--bad:#d2543a;--acc:#1f7a4a}
@media (prefers-color-scheme:dark){:root{--bg:#121a15;--card:#1c2620;--fg:#e8f0ea;--mut:#93a39a;--line:#2c3a31;--ok:#4cc27a;--bad:#ec7558;--acc:#4cc27a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0}
.pill{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--mut)}
.progress{display:flex;gap:5px;margin-bottom:16px}
.progress i{flex:1;height:7px;border-radius:9px;background:var(--line)}
.progress i.ok{background:var(--ok)}.progress i.bad{background:var(--bad)}.progress i.cur{background:var(--mut)}
.q{font-size:19px;font-weight:650;text-align:center;margin:4px 0 14px}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cty{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .12s,border-color .2s;user-select:none}
.cty:hover{transform:translateY(-2px)}
.cty:active{transform:scale(.98)}
.cty.locked{cursor:default;transform:none}
.cty.right{border-color:var(--ok)}.cty.wrong{border-color:var(--bad)}
.flag{font-size:34px;line-height:1}
.name{font-weight:650;margin:4px 0 6px}
.av{height:120px;display:flex;align-items:center;justify-content:center}
.stats{font-size:13px;color:var(--mut);min-height:38px;margin-top:6px}
.stats b{color:var(--fg)}
.bar{display:flex;height:8px;border-radius:9px;overflow:hidden;margin-top:6px;background:var(--line)}
.bar span{display:block;height:100%}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px;display:none}
.fact.show{display:block;animation:pop .3s}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:650;cursor:pointer}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.hidden{display:none}
.end{text-align:center}
.big{font-size:52px;font-weight:800;margin:6px 0}
.grid-share{font-size:24px;letter-spacing:2px;margin:6px 0 2px}
.rank{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:16px;text-align:left}
.rank h3{margin:4px 6px 8px;font-size:15px}
.rk{display:grid;grid-template-columns:34px 26px 1fr 52px;align-items:center;gap:6px;padding:3px 6px;font-size:14px}
.rk .mini{display:flex;justify-content:center}
.legend{font-size:12px;color:var(--mut);display:flex;gap:12px;justify-content:center;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes cough{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.0}30%{opacity:.85}100%{transform:translateY(-34px) scale(1.25);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.coughing{animation:cough .6s ease-in-out 3}
.happy{animation:bob 2s ease-in-out infinite}
.smoke circle{animation:puff 2.4s linear infinite}
.smoke circle:nth-child(2){animation-delay:.8s}.smoke circle:nth-child(3){animation-delay:1.6s}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🌍 Kdo je čistší?</h1><span class="pill" id="streak">🔥 0</span></header>

<div id="game">
  <div class="progress" id="prog"></div>
  <div class="q" id="q"></div>
  <div class="duel">
    <div class="cty" id="c0"></div>
    <div class="cty" id="c1"></div>
  </div>
  <div class="fact" id="fact"></div>
  <button class="btn hidden" id="next">Další →</button>
</div>

<div id="end" class="end hidden">
  <div style="color:var(--mut);margin-top:10px">Dnešní výsledek</div>
  <div class="big" id="score"></div>
  <div class="grid-share" id="emo"></div>
  <div id="verdict" style="margin-bottom:6px"></div>
  <button class="btn" id="copy">📋 Zkopírovat výsledek</button>
  <button class="btn sec" id="again">Hrát znovu (náhodné otázky)</button>
  <div class="rank"><h3>Žebříček zemí, od nejčistší po nejšpinavější</h3><div id="rank"></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>čisté (OZE + jádro)</span><span><i style="background:#6b6b6b"></i>uhlí</span><span><i style="background:#c9a24a"></i>plyn a ropa</span></div></div>
</div>

<p class="note">Prototyp s přibližnými daty o elektřině za rok 2024. Skutečná verze by brala čísla z Emberu (CC BY 4.0).</p>
</div>

<script>
// [název, vlajka, % čisté elektřiny (OZE + jádro), % uhlí]
const C=[
['Norsko','🇳🇴',98,0],['Island','🇮🇸',100,0],['Švédsko','🇸🇪',98,0],['Francie','🇫🇷',95,0],['Švýcarsko','🇨🇭',97,0],
['Rakousko','🇦🇹',90,0],['Finsko','🇫🇮',95,1],['Dánsko','🇩🇰',88,2],['Portugalsko','🇵🇹',87,0],['Španělsko','🇪🇸',77,1],
['Belgie','🇧🇪',78,0],['Slovensko','🇸🇰',85,2],['Česko','🇨🇿',58,34],['Německo','🇩🇪',62,22],['Polsko','🇵🇱',30,57],
['Itálie','🇮🇹',49,2],['Nizozemsko','🇳🇱',53,4],['Velká Británie','🇬🇧',70,1],['Řecko','🇬🇷',52,6],['Bulharsko','🇧🇬',63,25],
['Maďarsko','🇭🇺',76,3],['Rumunsko','🇷🇴',70,13],['Irsko','🇮🇪',42,1],['Čína','🇨🇳',39,58],['Indie','🇮🇳',22,75],
['USA','🇺🇸',41,15],['Jihoafrická rep.','🇿🇦',15,82],['Brazílie','🇧🇷',89,2],['Austrálie','🇦🇺',37,46],['Japonsko','🇯🇵',33,28],['Kanada','🇨🇦',82,4]
];
const ROUNDS=8;
const $=id=>document.getElementById(id);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const today=new Date(), dayKey=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
// gCO2/kWh – hrubý odhad: uhlí ~1000, plyn/ropa ~450, čisté ~20
const intensity=c=>Math.round(c[3]*10+(100-c[2]-c[3])*4.5+c[2]*0.2);

function makeRounds(seed){
  const r=rng(seed), out=[];
  while(out.length<ROUNDS){
    const a=C[Math.floor(r()*C.length)], b=C[Math.floor(r()*C.length)];
    if(a===b||out.some(o=>o.p.includes(a)&&o.p.includes(b))) continue;
    const type=r()<.7?'clean':'coal';
    const diff=type==='clean'?Math.abs(a[2]-b[2]):Math.abs(a[3]-b[3]);
    if(diff<8) continue;
    out.push({p:[a,b],type});
  }
  return out;
}

// ---------- postavička ----------
function face(c,size=110,anim=true){
  const clean=c[2], coal=c[3];
  const hue=Math.round(clean*1.2); // 0 = červená, 120 = zelená
  const body=`hsl(${hue},${coal>40?35:60}%,${coal>40?52:58}%)`;
  const mood=clean>=80?'happy':clean>=55?'ok':coal>=40?'sick':'meh';
  let mouth, eyes, extra='';
  if(mood==='happy'){
    mouth='<path d="M38 62 Q50 76 62 62" stroke="#1c2b22" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
    eyes=clean>=95
      ?'<rect x="27" y="40" width="20" height="11" rx="4" fill="#1c2b22"/><rect x="53" y="40" width="20" height="11" rx="4" fill="#1c2b22"/><path d="M47 44h6" stroke="#1c2b22" stroke-width="3"/>'
      :'<circle cx="38" cy="45" r="4" fill="#1c2b22"/><circle cx="62" cy="45" r="4" fill="#1c2b22"/>';
    extra='<circle cx="29" cy="58" r="5" fill="#ff8a8a" opacity=".5"/><circle cx="71" cy="58" r="5" fill="#ff8a8a" opacity=".5"/>';
  }else if(mood==='ok'){
    mouth='<path d="M40 64 Q50 69 60 64" stroke="#1c2b22" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
    eyes='<circle cx="38" cy="45" r="4" fill="#1c2b22"/><circle cx="62" cy="45" r="4" fill="#1c2b22"/>';
  }else if(mood==='meh'){
    mouth='<path d="M40 66 L60 66" stroke="#1c2b22" stroke-width="3.5" stroke-linecap="round"/>';
    eyes='<path d="M33 45h10M57 45h10" stroke="#1c2b22" stroke-width="3.5" stroke-linecap="round"/>';
  }else{
    mouth='<ellipse cx="50" cy="66" rx="7" ry="6" fill="#1c2b22"/>';
    eyes='<path d="M33 41l9 6M42 41l-9 6M58 41l9 6M67 41l-9 6" stroke="#1c2b22" stroke-width="3" stroke-linecap="round"/>';
    extra='<path d="M74 36 q4 6 0 9 q-4-3 0-9z" fill="#7cc4f0"/>';
  }
  const puffs=coal>=10?Math.min(3,Math.ceil(coal/20)):0;
  let smoke='';
  if(puffs){
    smoke='<g class="smoke" fill="#7a7a7a">';
    for(let i=0;i<puffs;i++) smoke+=`<circle cx="${50+(i-1)*14}" cy="14" r="${7+coal/12}" ${anim?'':'style="animation:none;opacity:.6"'}/>`;
    smoke+='</g>';
  }
  const leaf=clean>=85?'<path d="M50 12 q14 -6 16 6 q-12 6 -16 -6z" fill="#3fae5f"/><path d="M50 12 v8" stroke="#2c7a43" stroke-width="2"/>':'';
  const cls=anim?(mood==='sick'?'coughing':mood==='happy'?'happy':''):'';
  return `<svg width="${size}" height="${size*1.05}" viewBox="0 -8 100 105" class="${cls}">${smoke}${leaf}
    <circle cx="50" cy="54" r="34" fill="${body}"/>${eyes}${mouth}${extra}</svg>`;
}
const mystery=`<svg width="110" height="115" viewBox="0 -8 100 105"><circle cx="50" cy="54" r="34" fill="var(--line)"/><text x="50" y="68" text-anchor="middle" font-size="40" font-weight="800" fill="var(--mut)">?</text></svg>`;
function bar(c){const other=100-c[2]-c[3];return `<div class="bar"><span style="width:${c[2]}%;background:var(--ok)"></span><span style="width:${c[3]}%;background:#6b6b6b"></span><span style="width:${other}%;background:#c9a24a"></span></div>`}

// ---------- vtipné přepočty ----------
function fact(a,b,type){
  const [cl,di]=a[2]>=b[2]?[a,b]:[b,a];
  const ia=intensity(cl), ib=intensity(di);
  const ev=x=>Math.round(x*50/1000); // kg CO2 na nabití 50 kWh
  const km=x=>Math.round(x/0.15);
  const ratio=ia>0?Math.round(ib/Math.max(ia,1)):0;
  const pick=[
    `Nabití elektroauta (50 kWh) v zemi ${di[0]} vypustí asi <b>${ev(ib)} kg CO₂</b>, což odpovídá ${km(ev(ib))} km v benzínovém autě. V zemi ${cl[0]} jen <b>${ev(ia)} kg</b>.`,
    ratio>=3?`Stejná kilowatthodina je v zemi ${di[0]} zhruba <b>${ratio}× špinavější</b> než v zemi ${cl[0]}.`:`Kilowatthodina vypustí v zemi ${di[0]} asi <b>${ib} g CO₂</b>, v zemi ${cl[0]} asi <b>${ia} g</b>.`,
    di[3]>=30?`V zemi ${di[0]} svítí z uhlí zhruba <b>${di[3]>=50?'každá druhá':di[3]>=30?'každá třetí':'každá '+Math.round(100/di[3])+'.'} žárovka</b>.`:`Země ${cl[0]} má <b>${cl[2]} %</b> elektřiny z obnovitelných zdrojů a jádra.`
  ];
  return pick[(a[0].length+b[0].length)%pick.length];
}

// ---------- hra ----------
let rounds, idx, results, locked;
function start(seed){
  rounds=makeRounds(seed); idx=0; results=[];
  $('game').classList.remove('hidden'); $('end').classList.add('hidden');
  show();
}
function show(){
  locked=false;
  const R=rounds[idx];
  $('prog').innerHTML=rounds.map((_,i)=>`<i class="${i<results.length?(results[i]?'ok':'bad'):i===idx?'cur':''}"></i>`).join('');
  $('q').textContent=R.type==='clean'?'Která země má čistší elektřinu?':'Která země pálí víc uhlí?';
  R.p.forEach((c,i)=>{
    const el=$('c'+i);
    el.className='cty';
    el.innerHTML=`<div class="flag">${c[1]}</div><div class="name">${c[0]}</div><div class="av">${mystery}</div><div class="stats">&nbsp;</div>`;
    el.onclick=()=>answer(i);
  });
  $('fact').className='fact'; $('next').classList.add('hidden');
}
function answer(i){
  if(locked) return; locked=true;
  const R=rounds[idx], [a,b]=R.p;
  const correct=R.type==='clean'?(a[2]>b[2]?0:1):(a[3]>b[3]?0:1);
  const ok=i===correct; results.push(ok);
  R.p.forEach((c,j)=>{
    const el=$('c'+j); el.classList.add('locked');
    if(j===correct) el.classList.add('right'); else if(j===i) el.classList.add('wrong');
    el.querySelector('.av').innerHTML=face(c);
    el.querySelector('.stats').innerHTML=`<b>${c[2]} %</b> čisté · <b>${c[3]} %</b> uhlí${bar(c)}`;
  });
  $('fact').innerHTML=(ok?'✅ <b>Správně!</b> ':'❌ <b>Vedle.</b> ')+fact(a,b,R.type);
  $('fact').className='fact show';
  $('next').textContent=idx===ROUNDS-1?'Výsledek →':'Další →';
  $('next').classList.remove('hidden');
  $('prog').innerHTML=rounds.map((_,k)=>`<i class="${k<results.length?(results[k]?'ok':'bad'):''}"></i>`).join('');
}
$('next').onclick=()=>{ if(++idx<ROUNDS) show(); else finish(); };

function finish(){
  $('game').classList.add('hidden'); $('end').classList.remove('hidden');
  const s=results.filter(Boolean).length;
  $('score').textContent=`${s}/${ROUNDS}`;
  $('emo').textContent=results.map(r=>r?'🟩':'🟥').join('');
  $('verdict').textContent=s===ROUNDS?'Energetický guru! 🌞':s>=6?'Výborně, máš přehled. 🌱':s>=4?'Slušné, ale pár zemí tě zaskočilo. 🌤️':'Uhlí tě dneska převezlo. 🏭';
  $('rank').innerHTML=[...C].sort((x,y)=>intensity(x)-intensity(y)).map((c,i)=>
    `<div class="rk"><div class="mini">${face(c,30,false)}</div><div>${c[1]}</div><div>${c[0]}</div><div style="text-align:right;color:var(--mut)">${c[2]} %</div></div>`).join('');
  // série
  try{
    const st=JSON.parse(localStorage.getItem('cistsi')||'{}');
    if(st.last!==dayKey){st.streak=(st.last===dayKey-1?st.streak||0:0)+1;st.last=dayKey;localStorage.setItem('cistsi',JSON.stringify(st));}
    $('streak').textContent='🔥 '+st.streak;
  }catch(e){}
}
$('copy').onclick=async()=>{
  const txt=`Kdo je čistší? ${new Date().toLocaleDateString('cs-CZ')}\n${$('score').textContent} ${$('emo').textContent}`;
  try{await navigator.clipboard.writeText(txt);$('copy').textContent='✅ Zkopírováno';}catch(e){$('copy').textContent='Kopírování nejde, výsledek: '+$('score').textContent;}
  setTimeout(()=>$('copy').textContent='📋 Zkopírovat výsledek',2000);
};
$('again').onclick=()=>start(Math.floor(Math.random()*1e9));
try{const st=JSON.parse(localStorage.getItem('cistsi')||'{}');if(st.streak)$('streak').textContent='🔥 '+st.streak;}catch(e){}
start(dayKey);
</script>
</body>
</html>
